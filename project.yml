name: Gauge
options:
  bundleIdPrefix: com.cameronowens
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  Gauge:
    type: application
    platform: macOS
    sources:
      - Gauge
    dependencies:
      - framework: Vendor/Sparkle.framework
        embed: true
        codeSign: true
    info:
      path: Gauge/Resources/Info.plist
      properties:
        CFBundleName: Gauge
        CFBundleDisplayName: Gauge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSHumanReadableCopyright: Personal use
        SUFeedURL: https://raw.githubusercontent.com/cowens321-bit/Gauge/main/appcast.xml
        SUPublicEDKey: +mkkUW6Xcqbs2HjBnLDDUpbikPjkxx9LZzoobhvzrpA=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cameronowens.Gauge
        PRODUCT_NAME: Gauge
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_TESTABILITY: YES
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "4"
  GaugeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - path: Gauge
        excludes:
          - App
          - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cameronowens.GaugeTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Gauge:
    build:
      targets:
        Gauge: all
    test:
      targets:
        - GaugeTests
